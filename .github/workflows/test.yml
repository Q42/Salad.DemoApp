name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "16"

    - name: UI Tests
      run: fastlane test
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: TestResults.xcresult
        path: ./TestResults.xcresult
